name: Update GitHub activity calendar
on:
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: update-contributions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh public activity data
        run: python3 scripts/update-contributions.py
      - name: Save updated calendar
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update GitHub activity calendar'
          git push origin HEAD:main
      - name: Request branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
